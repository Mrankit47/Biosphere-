name: ❓ Question / Help
description: Ask a question or seek help regarding the BioSphere platform setup, codebase, or content.
title: "[QUESTION]: "
labels: ["help wanted", "question"]
body:
  - type: textarea
    id: topic
    attributes:
      label: What is your question or issue?
      placeholder: e.g., How do I customize the starting level or XP in the Supabase seed tables?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Context or Details
      description: Provide any background, configurations, or error messages that help explain your question.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Troubleshooting Checklist
      options:
        - label: I have read the root README and SUPPORT guides.
          required: true
        - label: I have searched through open and closed issues and discussions.
          required: true
