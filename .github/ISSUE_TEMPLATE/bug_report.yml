name: 🐛 Bug Report
description: File a report to help us identify and fix a bug in BioSphere.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this issue! Please provide as much details as possible to help us reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., The Osmosis visualizer crashes when adjusting the solute slider to maximum.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Explain how we can reproduce this behavior step-by-step.
      placeholder: |
        1. Open '/virtual-lab'
        2. Click on the Osmosis experiment
        3. Slide the solute bar all the way to the right
        4. See console crash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: e.g., The particles should flow faster across the membrane without crashing the canvas.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Device Details
      description: Please let us know your OS, browser, Node version, and any other relevant specs.
      placeholder: e.g., Windows 11, Chrome v120, Node v20.10.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Outputs
      description: Paste any error messages or console trace logs here.
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Verification Checklist
      options:
        - label: I have searched existing issues to ensure this has not already been reported.
          required: true
        - label: I am using the latest version of BioSphere.
          required: true
